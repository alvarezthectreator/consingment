<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Movere — Live Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--brown:#E0BD91;--cream:#f4f1ee;--green:#35b27a;--text:#171717}*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:var(--text);background:#ebe7e3}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(250,248,245,.94);border-bottom:1px solid rgba(224,189,145,.08)}.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;color:var(--text)}.brand__mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--brown);color:white}.back{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid #ddd5ce;border-radius:999px;text-decoration:none;color:var(--text);background:white;font-size:12px;font-weight:700}.map-shell{position:relative;height:calc(100svh - 72px);overflow:hidden;background:linear-gradient(135deg,#ece9e5,#f7f5f2)}.route-map{position:absolute;inset:0;width:100%;height:100%;background-image:radial-gradient(circle at 20% 25%,rgba(224,189,145,.10) 0 2px,transparent 3px),linear-gradient(135deg,transparent 45%,rgba(224,189,145,.07) 46%,transparent 47%),linear-gradient(45deg,transparent 45%,rgba(224,189,145,.06) 46%,transparent 47%);background-size:48px 48px,240px 240px,240px 240px}.route-line{fill:none;stroke:#e5434b;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 6px rgba(229,67,75,.12))}.map-info{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 16px 40px rgba(74,62,51,.12);backdrop-filter:blur(16px)}.map-info div{display:grid;gap:3px}.map-info span{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#98918b}.map-info strong{font-size:13px}.map-status{padding:7px 10px;border-radius:999px;background:#e7f5ed;color:var(--green);font-size:11px;font-weight:700}@keyframes routePulse{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}.route-line--animate{stroke-dasharray:10 10;animation:routePulse 1.2s linear infinite}@media(max-width:768px){.topbar{height:64px;padding:0 14px}.back{width:42px;padding:0;justify-content:center}.back span{display:none}.map-shell{height:calc(100svh - 64px)}.map-info{bottom:max(12px,env(safe-area-inset-bottom));}.brand__mark{width:38px;height:38px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="tracking.html"><span class="brand__mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.5 3.5 7v10L12 21.5 20.5 17V7L12 2.5Z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg></span>Movere</a><a class="back" href="tracking.html">← <span>Back to tracking</span></a></header>
  <main class="map-shell" aria-label="Live shipment route map"><svg class="route-map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="#cfe2f3"><path d="M0 0h190l25 90-45 75-170 20z"/><path d="M710 0h290v130l-90 40-130-80z"/><path d="M740 520h260v180H690z"/></g><g fill="#e8e1da" opacity=".9"><path d="M150 110h250l70 70-40 100H180z"/><path d="M540 40h220l60 130-100 90H520z"/><path d="M430 430h260l100 90-80 120H390z"/></g><g fill="#777" font-family="Manrope" font-size="14"><text x="125" y="180">Karlsborg</text><text x="330" y="260">Motala</text><text x="595" y="165">Linköping</text><text x="720" y="330">Vimmerby</text><text x="470" y="560">Vetlanda</text><text x="190" y="590">Nässjö</text></g><path class="route-line route-line--animate" d="M120 510C210 470 260 390 330 410S430 300 505 330 610 250 680 290 790 390 860 460"/><circle cx="120" cy="510" r="9" fill="#fff" stroke="#e5434b" stroke-width="5"/><circle cx="860" cy="460" r="12" fill="#E0BD91" stroke="#fff" stroke-width="5"/></svg><div class="map-info"><div><span>Shipment</span><strong>NP 421 2441 5551</strong></div><div><span>Last update</span><strong>13 Jan · 18:24</strong></div><span class="map-status">In Motion</span></div></main>
</body>
</html>
