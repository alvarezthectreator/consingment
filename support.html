<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Movere — Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brown:#E0BD91;--green:#35b27a;--text:#171717}*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:#ebe7e3;color:var(--text)}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(250,248,245,.94);border-bottom:1px solid rgba(224,189,145,.08)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700}.brand__mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--brown);color:white}.back{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid #ddd5ce;border-radius:999px;text-decoration:none;color:var(--text);background:white;font-size:12px;font-weight:700}.page{min-height:calc(100svh - 72px);padding:28px 16px}.support{width:min(720px,100%);margin:0 auto}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#98918b}.support h1{margin:8px 0 20px;font-size:32px;letter-spacing:-.04em}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.quick a{min-height:100px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:14px;border:1px solid rgba(224,189,145,.08);border-radius:16px;background:white;text-decoration:none;color:var(--text)}.quick span{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#E0BD91;color:white}.quick strong{font-size:12px}.form-card{padding:18px;border:1px solid rgba(224,189,145,.08);border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 18px 50px rgba(74,62,51,.08)}.form-card h2{margin:0 0 14px;font-size:16px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#98918b}.field input,.field textarea{width:100%;border:1px solid #e5dfd8;border-radius:12px;background:#fbfaf8;font:inherit;font-size:13px}.field input{height:46px;padding:0 12px}.field textarea{height:110px;padding:12px;resize:vertical}.submit{width:100%;height:48px;border:0;border-radius:12px;background:var(--brown);color:white;font:inherit;font-size:13px;font-weight:700}.status{min-height:20px;margin:10px 0 0;text-align:center;font-size:12px;color:#98918b}@media(max-width:768px){.topbar{height:64px;padding:0 14px}.back{width:42px;padding:0}.back span{display:none}.page{min-height:calc(100svh - 64px);padding:18px 14px}.support h1{font-size:26px}.quick{grid-template-columns:1fr}.quick a{min-height:76px}}
</style>
</head>
<body><header class="topbar"><a class="brand" href="tracking.html"><span class="brand__mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.5 3.5 7v10L12 21.5 20.5 17V7L12 2.5Z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg></span>Movere</a><a class="back" href="tracking.html">← <span>Back to tracking</span></a></header>
<main class="page"><section class="support"><p class="eyebrow">Support Center</p><h1>How can we help?</h1><div class="quick"><a href="tel:+380681209180"><span>☎</span><strong>Call support</strong></a><a href="mailto:support@movere.com"><span>@</span><strong>Email support</strong></a><a href="#support-form"><span>?</span><strong>Send a request</strong></a></div><form class="form-card" id="support-form"><h2>Send a support request</h2><div class="field"><label for="support-name">Name</label><input id="support-name" name="name" autocomplete="name" required></div><div class="field"><label for="support-tracking">Tracking number</label><input id="support-tracking" name="tracking" value="NP 421 2441 5551" required></div><div class="field"><label for="support-message">Message</label><textarea id="support-message" name="message" required></textarea></div><button class="submit" type="submit">Send request</button><p class="status" id="support-status" role="status"></p></form></section></main>
<script>document.getElementById('support-form').addEventListener('submit',event=>{event.preventDefault();document.getElementById('support-status').textContent='Support request ready to send. We will respond shortly.'})</script>
</body></html>
